x-logging: &logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'
x-app: &app
  build: .
  environment: &environment
    DATABASE_URL: postgres://iqhost:iqhost-local@postgres:5432/iqhost?sslmode=disable
    TEMPORAL_ADDRESS: temporal:7233
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
  logging: *logging
services:
  postgres:
    image: postgres:16.8-alpine
    environment:
      POSTGRES_PASSWORD: postgres-local
    ports: ['127.0.0.1:5432:5432']
    volumes:
      - demo-postgres-data:/var/lib/postgresql/data
      - ./deploy/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 3s
      timeout: 3s
      retries: 30
    logging: *logging
  temporal:
    image: temporalio/auto-setup:1.26.2
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal-local
      POSTGRES_SEEDS: postgres
      SKIP_DEFAULT_NAMESPACE_CREATION: 'false'
    depends_on:
      postgres: {condition: service_healthy}
    ports: ['127.0.0.1:7233:7233']
    healthcheck:
      test: ['CMD-SHELL', 'temporal operator cluster health --address temporal:7233 && temporal operator namespace describe --namespace default --address temporal:7233']
      interval: 5s
      timeout: 5s
      retries: 60
    logging: *logging
  ui:
    image: temporalio/ui:2.34.0
    environment:
      TEMPORAL_ADDRESS: temporal:7233
    ports: ['127.0.0.1:8080:8080']
    depends_on:
      temporal: {condition: service_healthy}
    logging: *logging
  migrate:
    <<: *app
    command: ['migrate']
    depends_on:
      postgres: {condition: service_healthy}
  simulator:
    <<: *app
    entrypoint: ['iqhost-simulator']
    command: ['--listen', ':8081', '--state-file', '/var/lib/iqhost-simulator/state.json']
    volumes:
      - simulator-data:/var/lib/iqhost-simulator
    ports: ['127.0.0.1:8081:8081']
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8081/healthz']
      interval: 3s
      timeout: 3s
      retries: 30
    stop_grace_period: 15s
  seed:
    <<: *app
    command: ['seed']
    depends_on:
      migrate: {condition: service_completed_successfully}
  worker:
    <<: *app
    entrypoint: ['iqhost-worker']
    environment:
      <<: *environment
      SIMULATOR_URL: http://simulator:8081
      FAIL_AT: ${FAIL_AT:-}
    depends_on:
      seed: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      simulator: {condition: service_healthy}
    stop_grace_period: 45s
  temporal-setup:
    <<: *app
    command: ['temporal-setup']
    depends_on:
      temporal: {condition: service_healthy}
  outbox:
    <<: *app
    entrypoint: ['iqhost-outbox']
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
      temporal-setup: {condition: service_completed_successfully}
  reconciler:
    <<: *app
    entrypoint: ['iqhost-reconciler']
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      temporal: {condition: service_healthy}
  admin:
    <<: *app
    entrypoint: ['iqhost-admin']
    command: ['--listen', ':8082', '--static-dir', '/opt/iqhost/admin']
    ports: ['127.0.0.1:8082:8082']
    depends_on:
      postgres: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
      seed: {condition: service_completed_successfully}
      demo: {condition: service_completed_successfully}
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://127.0.0.1:8082/healthz']
      interval: 5s
      timeout: 3s
      retries: 10
    stop_grace_period: 15s
  demo:
    <<: *app
    command: ['demo']
    depends_on:
      seed: {condition: service_completed_successfully}
      worker: {condition: service_started}
      outbox: {condition: service_started}
  cli:
    <<: *app
    profiles: ['cli']
    depends_on:
      seed: {condition: service_completed_successfully}
volumes:
  demo-postgres-data:
  simulator-data:
