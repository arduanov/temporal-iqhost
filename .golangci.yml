version: "2"

run:
  timeout: 5m
  tests: true

linters:
  default: none
  enable:
    - errcheck
    - govet
    - staticcheck
    - ineffassign
    - bodyclose
    - sqlclosecheck
    - gocritic
    - revive
    - funlen
  settings:
    govet:
      enable:
        - shadow
    revive:
      rules:
        - name: exported
          disabled: true
    funlen:
      lines: 60
      statements: -1

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gofumpt:
      module-path: temporal-iqhost
    gci:
      sections:
        - standard
        - default
        - prefix(temporal-iqhost)
